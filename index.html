<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181818" />
    <script>
      const storedTheme = localStorage.getItem("abap-collab.theme");
      const initialTheme = storedTheme === "light" || storedTheme === "dark"
        ? storedTheme
        : matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.dataset.theme = initialTheme;
      document.querySelector('meta[name="theme-color"]').content =
        initialTheme === "light" ? "#f3f3f3" : "#181818";
    </script>
    <title>ABAP Collaborate</title>
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <div class="window-mark" aria-hidden="true">A</div>
        <span id="titlebar-label" class="titlebar-label">report.abap — ABAP Collaborate</span>
        <div class="titlebar-actions">
          <span id="connection-status" class="connection-status">Connecting…</span>
          <button
            id="theme-toggle"
            class="quiet-button theme-toggle"
            type="button"
            aria-label="Switch color theme"
          >☀ Theme</button>
          <button id="new-room" class="quiet-button" type="button">New room</button>
          <button id="share-room" class="share-button" type="button">Share room</button>
        </div>
      </header>

      <main class="workbench">
        <nav class="activitybar" aria-label="Activity bar">
          <button
            id="explorer-toggle"
            class="activity-item active"
            type="button"
            aria-label="Hide Explorer"
            aria-controls="explorer-sidebar"
            aria-expanded="true"
            title="Hide Explorer (Ctrl+B)"
          >
            <span class="codicon codicon-files" aria-hidden="true"></span>
          </button>
          <div class="activity-spacer"></div>
          <button class="activity-item" type="button" aria-label="Settings">⚙</button>
        </nav>

        <aside id="explorer-sidebar" class="sidebar">
          <div class="sidebar-heading">EXPLORER</div>
          <section class="explorer-section">
            <div class="section-title explorer-title">
              <span>⌄</span>
              <span>ABAP ROOM</span>
              <span class="explorer-actions">
                <button id="new-file" class="explorer-action" type="button" aria-label="New file" title="New File">
                  <span class="codicon codicon-new-file" aria-hidden="true"></span>
                </button>
                <button id="new-folder" class="explorer-action" type="button" aria-label="New folder" title="New Folder">
                  <span class="codicon codicon-new-folder" aria-hidden="true"></span>
                </button>
                <button
                  id="explorer-menu-button"
                  class="explorer-action explorer-menu-button"
                  type="button"
                  aria-label="More Explorer actions"
                  aria-haspopup="menu"
                  title="More Actions"
                >
                  <span class="codicon codicon-more" aria-hidden="true"></span>
                </button>
              </span>
            </div>
            <div id="explorer-tree" class="explorer-tree" role="tree" aria-label="Room files" tabindex="0"></div>
            <div id="explorer-menu" class="explorer-menu" role="menu" hidden>
              <button type="button" role="menuitem" data-command="new-file"><span>New File</span><kbd>Ctrl+N</kbd></button>
              <button type="button" role="menuitem" data-command="new-folder"><span>New Folder</span></button>
              <span class="menu-separator" role="separator"></span>
              <button type="button" role="menuitem" data-command="rename"><span>Rename</span><kbd>F2</kbd></button>
              <button type="button" role="menuitem" data-command="cut"><span>Cut</span><kbd>Ctrl+X</kbd></button>
              <button type="button" role="menuitem" data-command="copy"><span>Copy</span><kbd>Ctrl+C</kbd></button>
              <button type="button" role="menuitem" data-command="paste"><span>Paste</span><kbd>Ctrl+V</kbd></button>
              <span class="menu-separator" role="separator"></span>
              <button type="button" role="menuitem" data-command="delete"><span>Delete</span><kbd>Delete</kbd></button>
            </div>
          </section>
          <section class="presence-section">
            <div class="section-title"><span>⌄</span> PARTICIPANTS</div>
            <label class="name-label" for="display-name">Your name</label>
            <input id="display-name" class="name-input" maxlength="32" autocomplete="off" />
            <div class="color-heading">
              <span>Your color</span>
              <span id="color-help" class="color-help">Used colors are unavailable</span>
            </div>
            <div
              id="color-picker"
              class="color-picker"
              role="radiogroup"
              aria-label="Your collaboration color"
              aria-describedby="color-help"
            ></div>
            <div id="participants" class="participants" aria-live="polite"></div>
          </section>
        </aside>

        <section class="editor-area">
          <div class="tabbar">
            <div id="editor-tab" class="editor-tab active">
              <span id="tab-file-icon" class="abap-file-icon">A</span>
              <span id="tab-file-name">report.abap</span>
            </div>
          </div>
          <div id="breadcrumbs" class="breadcrumbs"><span>ABAP ROOM</span><span>›</span><span>report.abap</span></div>
          <div id="editor" class="editor" aria-label="Collaborative ABAP editor"></div>
        </section>
      </main>

      <footer class="statusbar">
        <span class="status-remote">⑂</span>
        <span id="room-label">Room</span>
        <span class="status-spacer"></span>
        <span id="cursor-position">Ln 1, Col 1</span>
        <span>Spaces: 2</span>
        <span>UTF-8</span>
        <span>ABAP</span>
      </footer>
    </div>
    <div id="toast" class="toast" role="status"></div>
    <style id="presence-styles"></style>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
